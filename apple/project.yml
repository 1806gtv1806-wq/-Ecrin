name: Ecrin
options:
  bundleIdPrefix: com.ecrin
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  Ecrin-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Ecrin-iOS-Info.plist
      properties:
        NSLocalNetworkUsageDescription: ÉCRIN détecte vos appareils à proximité pour proposer de continuer Einstein sur un autre écran.
        NSBonjourServices:
          - _ecrin-handoff._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.halo.cubemaster.playground
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Ecrin.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ecrin
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Ecrin analyse les images que vous choisissez.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Ecrin utilise le microphone lorsque vous dictez une question à Einstein.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Ecrin transcrit votre question vocale pour Einstein.
  Ecrin-macOS:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Ecrin-macOS-Info.plist
      properties:
        NSLocalNetworkUsageDescription: ÉCRIN détecte vos appareils à proximité pour proposer de continuer Einstein sur un autre écran.
        NSBonjourServices:
          - _ecrin-handoff._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ecrin.app.macos
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Ecrin.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ecrin
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Ecrin analyse les images que vous choisissez.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Ecrin utilise le microphone lorsque vous dictez une question à Einstein.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Ecrin transcrit votre question vocale pour Einstein.
