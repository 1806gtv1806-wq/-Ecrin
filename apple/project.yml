name: Ecrin
options:
  bundleIdPrefix: com.ecrin
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  Ecrin-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ecrin.app
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Ecrin.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ecrin
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Ecrin analyse les images que vous choisissez.
  Ecrin-macOS:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ecrin.app.macos
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Ecrin.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ecrin
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Ecrin analyse les images que vous choisissez.
