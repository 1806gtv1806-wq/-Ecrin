name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload Ecrin to TestFlight
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APP_BUNDLE_ID: ch.halo.cubemaster.playground
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate distribution secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$APPLE_TEAM_ID" ]] || { echo "::error::Configure APPLE_TEAM_ID."; exit 1; }
          [[ -n "$APP_STORE_CONNECT_API_KEY_ID" ]] || { echo "::error::Configure APP_STORE_CONNECT_API_KEY_ID."; exit 1; }
          [[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]] || { echo "::error::Configure APP_STORE_CONNECT_ISSUER_ID."; exit 1; }
          [[ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]] || { echo "::error::Configure APP_STORE_CONNECT_API_KEY_BASE64."; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]] || { echo "::error::Configure IOS_DISTRIBUTION_CERTIFICATE_BASE64."; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] || { echo "::error::Configure IOS_DISTRIBUTION_CERTIFICATE_PASSWORD."; exit 1; }
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] || { echo "::error::Configure IOS_PROVISIONING_PROFILE_BASE64."; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Prepare signing assets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ecrin-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/ecrin-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ecrin-app-store.mobileprovision"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PROFILE_PLIST="$RUNNER_TEMP/ecrin-profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$API_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_ENV"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive signed iOS app
        working-directory: apple
        run: |
          set -euo pipefail
          xcodebuild \
            -project Ecrin.xcodeproj \
            -scheme Ecrin-iOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ecrin.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION=1.0.0 \
            archive

      - name: Export App Store package
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "destination": "export",
              "method": "app-store-connect",
              "signingStyle": "manual",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["APP_BUNDLE_ID"]: os.environ["PROFILE_NAME"]
              },
              "uploadSymbols": True,
          }
          Path(os.environ["RUNNER_TEMP"], "ExportOptions.plist").write_bytes(
              plistlib.dumps(options)
          )
          PY
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Ecrin.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload build to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Ecrin.ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ecrin-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/ecrin-signing.keychain-db"
          fi
          rm -f \
            "$RUNNER_TEMP/ecrin-distribution.p12" \
            "$RUNNER_TEMP/ecrin-app-store.mobileprovision" \
            "$RUNNER_TEMP/ecrin-profile.plist" \
            "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
