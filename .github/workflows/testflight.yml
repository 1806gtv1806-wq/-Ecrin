name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload Ecrin to TestFlight
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APP_BUNDLE_ID: ch.halo.cubemaster.playgrounds
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate distribution secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$APPLE_TEAM_ID" ]] || { echo "::error::Configure APPLE_TEAM_ID."; exit 1; }
          [[ -n "$APP_STORE_CONNECT_API_KEY_ID" ]] || { echo "::error::Configure APP_STORE_CONNECT_API_KEY_ID."; exit 1; }
          [[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]] || { echo "::error::Configure APP_STORE_CONNECT_ISSUER_ID."; exit 1; }
          [[ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]] || { echo "::error::Configure APP_STORE_CONNECT_API_KEY_BASE64."; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]] || { echo "::error::Configure IOS_DISTRIBUTION_CERTIFICATE_BASE64."; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] || { echo "::error::Configure IOS_DISTRIBUTION_CERTIFICATE_PASSWORD."; exit 1; }
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] || { echo "::error::Configure IOS_PROVISIONING_PROFILE_BASE64."; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Prepare signing assets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ecrin-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/ecrin-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ecrin-app-store.mobileprovision"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          if ! printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_BASE64 is not valid Base64."
            exit 1
          fi
          if ! openssl pkcs12 -in "$CERTIFICATE_PATH" \
            -passin env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD -noout; then
            echo "::error::The distribution certificate is not a valid .p12 or its password is incorrect."
            exit 1
          fi
          if ! printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is not valid Base64."
            exit 1
          fi
          if ! printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$API_KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 is not valid Base64."
            exit 1
          fi
          if ! openssl pkey -in "$API_KEY_PATH" -noout; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 must decode to the original App Store Connect .p8 private key."
            exit 1
          fi

          PROFILE_PLIST="$RUNNER_TEMP/ecrin-profile.plist"
          if ! security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"; then
            echo "::error::The provisioning profile secret is not a valid Apple .mobileprovision file. Download a fresh App Store profile and Base64-encode the entire file."
            exit 1
          fi
          python3 - "$PROFILE_PLIST" "$CERTIFICATE_PATH" <<'PY'
          import datetime
          import hashlib
          import os
          import plistlib
          import subprocess
          import sys
          from pathlib import Path

          def fail(message):
              print(f"::error::{message}")
              raise SystemExit(1)

          profile_path, certificate_path = map(Path, sys.argv[1:])
          with profile_path.open("rb") as profile_file:
              profile = plistlib.load(profile_file)

          team_id = os.environ["APPLE_TEAM_ID"]
          bundle_id = os.environ["APP_BUNDLE_ID"]
          expected_app_id = f"{team_id}.{bundle_id}"
          entitlements = profile.get("Entitlements", {})
          actual_app_id = entitlements.get("application-identifier")
          if actual_app_id != expected_app_id:
              fail(
                  "The provisioning profile does not match the app. "
                  f"Expected application-identifier {expected_app_id!r}, got {actual_app_id!r}."
              )
          if team_id not in profile.get("TeamIdentifier", []):
              fail("The provisioning profile belongs to a different Apple Developer team.")

          expiration = profile.get("ExpirationDate")
          if isinstance(expiration, datetime.datetime) and expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=datetime.timezone.utc)
          if not isinstance(expiration, datetime.datetime) or expiration <= datetime.datetime.now(datetime.timezone.utc):
              fail("The provisioning profile is expired or has no valid expiration date.")

          certificates = profile.get("DeveloperCertificates", [])
          if not certificates:
              fail("The provisioning profile contains no distribution certificates.")

          cert_pem = subprocess.run(
              [
                  "openssl", "pkcs12", "-in", str(certificate_path),
                  "-passin", "env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD",
                  "-clcerts", "-nokeys",
              ],
              check=True,
              capture_output=True,
          ).stdout
          cert_der = subprocess.run(
              ["openssl", "x509", "-outform", "DER"],
              input=cert_pem,
              check=True,
              capture_output=True,
          ).stdout
          cert_fingerprint = hashlib.sha256(cert_der).digest()
          profile_fingerprints = {hashlib.sha256(cert).digest() for cert in certificates}
          if cert_fingerprint not in profile_fingerprints:
              fail(
                  "The provisioning profile does not include the Apple Distribution certificate "
                  "configured in IOS_DISTRIBUTION_CERTIFICATE_BASE64."
              )

          print(
              f"Validated App Store profile {profile.get('Name', '(unnamed)')!r} "
              f"for {bundle_id}; it matches the configured distribution certificate."
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$API_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_ENV"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive signed iOS app
        working-directory: apple
        run: |
          set -euo pipefail
          xcodebuild \
            -project Ecrin.xcodeproj \
            -scheme Ecrin-iOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ecrin.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION=1.0.0 \
            archive

      - name: Export App Store package
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "destination": "export",
              "method": "app-store-connect",
              "signingStyle": "manual",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["APP_BUNDLE_ID"]: os.environ["PROFILE_NAME"]
              },
              "uploadSymbols": True,
          }
          Path(os.environ["RUNNER_TEMP"], "ExportOptions.plist").write_bytes(
              plistlib.dumps(options)
          )
          PY
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Ecrin.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload build to App Store Connect
        run: |
          set -euo pipefail
          mapfile -t IPA_FILES < <(find "$RUNNER_TEMP/export" -maxdepth 1 -type f -name '*.ipa' -print)
          if [[ ${#IPA_FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one exported .ipa in $RUNNER_TEMP/export; found ${#IPA_FILES[@]}."
            find "$RUNNER_TEMP/export" -maxdepth 2 -type f -print
            exit 1
          fi
          IPA_PATH="${IPA_FILES[0]}"
          echo "Uploading $(basename "$IPA_PATH") to App Store Connect."
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ecrin-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/ecrin-signing.keychain-db"
          fi
          rm -f \
            "$RUNNER_TEMP/ecrin-distribution.p12" \
            "$RUNNER_TEMP/ecrin-app-store.mobileprovision" \
            "$RUNNER_TEMP/ecrin-profile.plist" \
            "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
