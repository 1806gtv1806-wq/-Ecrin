name: Apple build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apple/**'
      - '.github/workflows/apple-build.yml'

permissions:
  contents: read

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iPhone and iPad app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: apple
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Ecrin.xcodeproj \
            -scheme Ecrin-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath "$RUNNER_TEMP/Ecrin-Build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/Ecrin-Build.log"

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecrin-ios-build-diagnostics
          path: |
            ${{ runner.temp }}/Ecrin-Build.log
            ${{ runner.temp }}/Ecrin-Build.xcresult
          if-no-files-found: warn
          retention-days: 7
